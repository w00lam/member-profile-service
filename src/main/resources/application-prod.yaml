spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/member-profile-service/prod/
  cloud:
    aws:
      parameterstore:
        region: ap-northeast-2
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

management:
  info:
    env:
      enabled: true

info:
  team-name: ${TEAM_NAME}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
