spring:
  config:
    activate:
      on-profile: local
  cloud:
    aws:
      parameterstore:
        enabled: false
  datasource:
    url: jdbc:h2:mem:member_profile;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
